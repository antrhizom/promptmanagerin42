<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt-Check: Welcher Prompt ist stärker?</title>
<style>
  :root {
    --grund: #f6f7fb;
    --flaeche: #ffffff;
    --text: #1a1a2e;
    --text-leise: #5b6072;
    --linie: #dfe2ec;
    --akzent: #2563eb;
    --akzent-hell: #e3ecfd;
    --richtig: #0f7a55;
    --richtig-hell: #dff5ec;
    --falsch: #b42318;
    --falsch-hell: #fde8e6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--grund);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 860px; margin: 0 auto; padding: 28px 18px 48px; }
  h1 { font-size: clamp(1.5rem, 4vw, 2rem); line-height: 1.15; margin: 0 0 6px; }
  .einleitung { color: var(--text-leise); margin: 0 0 22px; max-width: 60ch; }

  .kopf { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .runde { font-weight: 700; font-size: 0.9rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-leise); }
  .punkte { font-weight: 700; font-variant-numeric: tabular-nums; }
  .balken { height: 6px; background: var(--linie); border-radius: 99px; overflow: hidden; margin-bottom: 20px; }
  .balken span { display: block; height: 100%; background: var(--akzent); transition: width 0.3s ease; }

  .frage { font-size: 1.1rem; font-weight: 600; margin: 0 0 14px; }
  .auswahl { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .auswahl { grid-template-columns: 1fr; } }

  .prompt {
    text-align: left; font: inherit; color: inherit; cursor: pointer;
    background: var(--flaeche); border: 2px solid var(--linie); border-radius: 12px;
    padding: 16px; display: flex; flex-direction: column; gap: 8px;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .prompt:hover:not(:disabled) { border-color: var(--akzent); transform: translateY(-2px); }
  .prompt:focus-visible { outline: 3px solid var(--akzent); outline-offset: 2px; }
  .prompt:disabled { cursor: default; }
  .prompt .marke { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-leise); }
  .prompt .inhalt { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 0.92rem; white-space: pre-wrap; }
  .prompt.staerker { border-color: var(--richtig); background: var(--richtig-hell); }
  .prompt.schwaecher { border-color: var(--linie); opacity: 0.75; }
  .prompt.falsch-gewaehlt { border-color: var(--falsch); background: var(--falsch-hell); opacity: 1; }

  .rueckmeldung { margin-top: 16px; background: var(--flaeche); border: 1px solid var(--linie); border-radius: 12px; padding: 16px; }
  .rueckmeldung .urteil { font-weight: 700; margin: 0 0 4px; }
  .rueckmeldung .urteil.ok { color: var(--richtig); }
  .rueckmeldung .urteil.nein { color: var(--falsch); }
  .rueckmeldung .prinzip { display: inline-block; background: var(--akzent-hell); color: var(--akzent); font-weight: 700; font-size: 0.8rem; border-radius: 99px; padding: 2px 10px; margin-bottom: 8px; }
  .rueckmeldung p { margin: 0; }

  .knopf {
    margin-top: 16px; font: inherit; font-weight: 700; cursor: pointer;
    background: var(--akzent); color: #fff; border: 0; border-radius: 10px; padding: 11px 20px;
  }
  .knopf:hover { filter: brightness(0.94); }
  .knopf:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }

  .schluss { background: var(--flaeche); border: 1px solid var(--linie); border-radius: 12px; padding: 24px; }
  .schluss h2 { margin: 0 0 6px; font-size: 1.4rem; }
  .schluss ul { margin: 12px 0 0; padding-left: 20px; }
  .schluss li { margin-bottom: 4px; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1 id="titel"></h1>
  <p class="einleitung" id="einleitung"></p>

  <section id="spiel" aria-live="polite">
    <div class="kopf">
      <span class="runde" id="runde"></span>
      <span class="punkte" id="punkte"></span>
    </div>
    <div class="balken"><span id="fortschritt"></span></div>
    <p class="frage" id="frage"></p>
    <div class="auswahl">
      <button class="prompt" id="promptA" type="button"><span class="marke">Prompt A</span><span class="inhalt"></span></button>
      <button class="prompt" id="promptB" type="button"><span class="marke">Prompt B</span><span class="inhalt"></span></button>
    </div>
    <div class="rueckmeldung" id="rueckmeldung" hidden>
      <p class="urteil" id="urteil"></p>
      <span class="prinzip" id="prinzip"></span>
      <p id="begruendung"></p>
    </div>
    <button class="knopf" id="weiter" type="button" hidden></button>
  </section>

  <section class="schluss" id="schluss" hidden>
    <h2 id="schlussTitel"></h2>
    <p id="schlussText"></p>
    <ul id="merkliste"></ul>
    <button class="knopf" id="nochmal" type="button">Nochmals spielen</button>
  </section>
</main>

<script>
/* ============================================================
   HIER ANPASSEN
   Alle Inhalte stehen in DATEN. Für ein anderes Thema genügt es,
   diesen Block zu ersetzen: Titel, Einleitung und die Runden.
   «staerker» nennt den besseren Prompt ("A" oder "B").
   ============================================================ */
const DATEN = {
  titel: "Prompt-Check: Welcher Prompt ist stärker?",
  einleitung: "Zwei Prompts, ein Ziel. Wähle in jeder Runde den Prompt, der voraussichtlich das brauchbarere Ergebnis liefert.",
  frage: "Welcher Prompt ist stärker?",
  runden: [
    {
      prinzip: "Zielgruppe und Umfang nennen",
      a: "Schreib etwas über Fotosynthese.",
      b: "Erkläre Fotosynthese für Lernende im 1. Lehrjahr (Gärtner/in EFZ) in fünf kurzen Sätzen und mit einem Beispiel aus dem Betrieb.",
      staerker: "B",
      begruendung: "Prompt B sagt, für wen der Text ist, wie lang er sein soll und welcher Bezug hilft. Ohne diese Angaben muss die KI raten."
    },
    {
      prinzip: "Rolle und Format vorgeben",
      a: "Du bist Lerncoach. Erstelle fünf Multiple-Choice-Fragen zum Kaufvertrag mit je vier Antworten. Markiere die richtige Antwort und begründe sie in einem Satz.",
      b: "Mach ein Quiz zum Kaufvertrag.",
      staerker: "A",
      begruendung: "Prompt A legt Rolle, Anzahl, Aufbau und Lösungsteil fest. So ist das Ergebnis direkt einsetzbar und muss nicht nachgebessert werden."
    },
    {
      prinzip: "Ein Beispiel mitgeben",
      a: "Formuliere diese Rückmeldung freundlicher: «Der Schluss fehlt.»",
      b: "Formuliere diese Rückmeldung freundlicher: «Der Schluss fehlt.» So soll der Ton klingen: «Dein Einstieg ist klar. Beim Schluss fehlt noch ein Fazit.»",
      staerker: "B",
      begruendung: "«Freundlicher» versteht jede Person anders. Das Beispiel in Prompt B zeigt den gewünschten Ton, statt ihn nur zu beschreiben."
    },
    {
      prinzip: "Rückfragen einfordern",
      a: "Plane eine Doppellektion zum Thema Budget. Stelle mir zuerst drei Rückfragen zu Klasse, Zeit und Vorwissen, bevor du planst.",
      b: "Plane eine Doppellektion zum Thema Budget.",
      staerker: "A",
      begruendung: "Mit den Rückfragen holt sich die KI die Angaben, die für eine passende Planung fehlen. Prompt B führt zu einer Planung für eine Durchschnittsklasse."
    },
    {
      prinzip: "An eine Quelle binden",
      a: "Nenne mir Zahlen und Quellen zur Lehrstellensituation.",
      b: "Fasse den angehängten Bericht zur Lehrstellensituation zusammen. Nutze nur Angaben aus dem Bericht und markiere, was darin offen bleibt.",
      staerker: "B",
      begruendung: "Prompt A lädt dazu ein, Zahlen und Quellen zu erfinden. Prompt B bindet die Antwort an einen Text, den du selbst prüfen kannst."
    }
  ]
};
/* ===================== ENDE ANPASSEN ===================== */

const el = id => document.getElementById(id);
let index = 0;
let punkte = 0;

function punktText() {
  return punkte + (punkte === 1 ? " Punkt" : " Punkte");
}

function zeigeRunde() {
  const runde = DATEN.runden[index];
  el("runde").textContent = "Runde " + (index + 1) + " von " + DATEN.runden.length;
  el("punkte").textContent = punktText();
  el("fortschritt").style.width = (index / DATEN.runden.length * 100) + "%";
  el("frage").textContent = DATEN.frage;
  for (const seite of ["A", "B"]) {
    const knopf = el("prompt" + seite);
    knopf.disabled = false;
    knopf.className = "prompt";
    knopf.querySelector(".inhalt").textContent = seite === "A" ? runde.a : runde.b;
  }
  el("rueckmeldung").hidden = true;
  el("weiter").hidden = true;
}

function waehle(seite) {
  const runde = DATEN.runden[index];
  const richtig = seite === runde.staerker;
  if (richtig) punkte++;
  for (const s of ["A", "B"]) {
    const knopf = el("prompt" + s);
    knopf.disabled = true;
    if (s === runde.staerker) knopf.classList.add("staerker");
    else knopf.classList.add(s === seite ? "falsch-gewaehlt" : "schwaecher");
  }
  const urteil = el("urteil");
  urteil.textContent = richtig
    ? "Richtig, Prompt " + runde.staerker + " ist stärker."
    : "Nicht ganz: Prompt " + runde.staerker + " ist stärker.";
  urteil.className = "urteil " + (richtig ? "ok" : "nein");
  el("prinzip").textContent = runde.prinzip;
  el("begruendung").textContent = runde.begruendung;
  el("rueckmeldung").hidden = false;
  el("punkte").textContent = punktText();
  const weiter = el("weiter");
  weiter.textContent = index + 1 < DATEN.runden.length ? "Nächste Runde" : "Auswertung ansehen";
  weiter.hidden = false;
  weiter.focus();
}

function weiter() {
  index++;
  if (index < DATEN.runden.length) { zeigeRunde(); el("promptA").focus(); return; }
  el("spiel").hidden = true;
  el("schluss").hidden = false;
  el("schlussTitel").textContent = punkte + " von " + DATEN.runden.length + (DATEN.runden.length === 1 ? " Punkt" : " Punkten");
  el("schlussText").textContent = "Diese Prinzipien machen einen Prompt stärker:";
  const liste = el("merkliste");
  liste.textContent = "";
  for (const runde of DATEN.runden) {
    const li = document.createElement("li");
    li.textContent = runde.prinzip;
    liste.appendChild(li);
  }
  el("nochmal").focus();
}

function neu() {
  index = 0;
  punkte = 0;
  el("schluss").hidden = true;
  el("spiel").hidden = false;
  zeigeRunde();
}

el("titel").textContent = DATEN.titel;
el("einleitung").textContent = DATEN.einleitung;
document.title = DATEN.titel;
el("promptA").addEventListener("click", () => waehle("A"));
el("promptB").addEventListener("click", () => waehle("B"));
el("weiter").addEventListener("click", weiter);
el("nochmal").addEventListener("click", neu);
zeigeRunde();
</script>
</body>
</html>
